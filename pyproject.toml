[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bedrock-agent-starter"
version = "0.1.0"
description = "Production-shaped starter for AI agents on Amazon Bedrock — tools, memory, observability, IaC, evals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fernando Francisco Azevedo", email = "fernando@moretes.com" }]
keywords = ["bedrock", "ai", "agent", "aws", "llm", "tool-use", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "boto3>=1.34",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "moto[bedrock,dynamodb]>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-boto3",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-mermaid2-plugin>=1.1",
]

[project.urls]
Homepage = "https://github.com/fernandofatech/bedrock-agent-starter"
Documentation = "https://fernandofatech.github.io/bedrock-agent-starter/"
Repository = "https://github.com/fernandofatech/bedrock-agent-starter"
Issues = "https://github.com/fernandofatech/bedrock-agent-starter/issues"

[project.scripts]
agent = "agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RET", "ARG"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
