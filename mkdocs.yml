site_name: bedrock-agent-starter
site_url: https://fernandofatech.github.io/bedrock-agent-starter/
site_description: Production-shaped starter for AI agents on Amazon Bedrock.
site_author: Fernando Francisco Azevedo
repo_url: https://github.com/fernandofatech/bedrock-agent-starter
repo_name: fernandofatech/bedrock-agent-starter
edit_uri: edit/develop/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - mermaid2

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fernandofatech
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/fernando-francisco-azevedo/
    - icon: fontawesome/solid/globe
      link: https://fernando.moretes.com

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Adding a tool: adding-a-tool.md
  - Deployment: deployment.md
  - Observability: observability.md
  - Evals: evals.md
  - Architecture: architecture.md
  - ADRs:
      - "0001 - Converse API as the core": adr/0001-converse-api.md
      - "0002 - Tool registry over framework magic": adr/0002-tool-registry.md
